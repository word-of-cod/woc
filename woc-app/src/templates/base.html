{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World of COD{% endblock %}</title>

    {% tailwind_css %}

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-neutral-950 text-neutral-200 font-sans min-h-screen">

    <!-- HEADER -->
    <header class="bg-neutral-900 border-b border-neutral-800 px-10 py-4">
        <div class="flex items-center justify-between">

            <!-- LEFT: LOGO -->
            <div class="flex items-center gap-4">
                <img src="{% static 'images/word_of_cod_compressed.jpg' %}"
                     alt="World of COD Logo"
                     class="h-20 rounded-md object-cover">
                <h1 class="text-xl font-bold text-white">World of COD</h1>
            </div>

            <!-- NAV LINKS -->
            <nav class="flex items-center gap-6 text-sm">
                <a href="/" class="text-neutral-400 hover:text-white transition">Dashboard</a>
                <a href="/matches/" class="text-neutral-400 hover:text-white transition">Matches</a>
                <a href="/players/" class="text-neutral-400 hover:text-white transition">Players</a>
                <a href="/teams/" class="text-neutral-400 hover:text-white transition">Teams</a>
            </nav>
        </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="px-10 py-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
