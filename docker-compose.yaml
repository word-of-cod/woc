services:
  db:
    image: postgres:15
    container_name: woc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: woc-app
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      if [ \"$$LOAD_TEST_DATA\" = \"true\" ]; then python manage.py seed_test_data; fi &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      LOAD_TEST_DATA: ${LOAD_TEST_DATA:-true}
      UNDERDOG_BASE_URL: ${UNDERDOG_BASE_URL:-https://api.underdogfantasy.com}
      UNDERDOG_STATE_CONFIG_ID: ${UNDERDOG_STATE_CONFIG_ID:-8176bf5b-d026-4be0-b6b8-02f1f101a8c6}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
